version: 2
# Mirrors ohcnetwork/care: routine maintenance runs every January and July,
# using releases at least 90 days old, grouped into a single PR.
# Dependabot cannot filter by the age of the currently installed version.
# Security updates must be enabled in repository settings; they bypass this
# schedule, cooldown, and version-update PR limit.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "semiannually"
    cooldown:
      default-days: 90
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"
